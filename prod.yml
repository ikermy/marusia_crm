services:
  # ── air_marusia_crm ──────────────────────────────────────────────────────────────────
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: 2
    labels:
      logging: loki
      app: air
      service: crm
      tier: backend
    image: crm:prod   # фиксированное имя образа
    container_name: crm_app
    restart: unless-stopped
    environment:
      # ── База данных (локальный сервер на хосте) ─────────────────────────────
      - DB_HOST=air_db:3306
      - DB_NAME=air
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

      # ── Redis (общий для всех сервисов) ─────────────────────────────────────
      - REDIS_ADDR=air_redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0

      # ── gRPC конфигурация (для получения настроек Telegram-бота) ───────────
      # Указывает адрес ConfigService от AiR_ORCHESTRATOR (в Docker-сети или с хоста)
      - GRPC_CONFIG_HOST=airorc:50051

      # Путь к файлу с сервисным ключом (примонтирован через volume)
      - SERVICE_KEY_FILE=/run/secrets/service_key

      # ── Домен и порты смежных сервисов ───────────────────────────────────────
      - REAL_URL=${DOMAIN}

      # ── Логирование ──────────────────────────────────────────────────────────
      - LOG_LEVEL=info

      # ── Прочее ───────────────────────────────────────────────────────────────
      - GLOB_USER_MODEL_TTL=1440

    # Волюмы для логов и сервисного ключа
    volumes:
      - ./.service_key:/run/secrets/service_key:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - monitoring_shared
      - air_shared

networks:
  monitoring_shared:
    external: true
  air_shared:
    external: true